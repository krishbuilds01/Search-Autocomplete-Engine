<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Autocomplete</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15vh;
      margin: 0;
    }
    h2 {
      font-weight: 400;
      font-size: 28px;
      margin-bottom: 25px;
      color: #5f6368;
    }
    .search-container {
      position: relative;
      width: 100%;
      max-width: 500px;
    }
    .search-box {
      width: 100%;
      padding: 14px 22px;
      font-size: 16px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
      box-sizing: border-box;
      outline: none;
      transition: box-shadow 0.2s;
    }
    .search-box:focus {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: rgba(223, 225, 229, 0);
    }
    .results-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(32, 33, 36, 0.15);
      border: 1px solid #eee;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      box-sizing: border-box;
      z-index: 1000;
      padding: 8px 0;
    }
    .results-dropdown.active {
      display: block;
    }
    .result-item {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 15px;
      color: #212529;
    }
    .result-item:hover, .result-item.selected {
      background: #f1f3f4;
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #80868b;
      text-align: center;
    }
    .highlight {
      font-weight: bold;
      color: #1a73e8; /* Standard Google Blue */
    }
    .no-results {
      padding: 10px 20px;
      color: #5f6368;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h2>Autocomplete Demo</h2>

  <div class="search-container">
    <input type="text" class="search-box" id="searchInput" placeholder="Search..." autocomplete="off">
    <div class="results-dropdown" id="resultsBox"></div>
    <p class="note">Suggestions are ranked by how often they are picked. Picking one moves it up.</p>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('resultsBox');

    let debounceTimer;

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      
      clearTimeout(debounceTimer);
      
      if (query.length === 0) {
        resultsBox.classList.remove('active');
        resultsBox.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/autocomplete?q=${encodeURIComponent(query)}`);
          const json = await res.json();
          
          if (json.data && json.data.length > 0) {
            renderResults(json.data, query);
            resultsBox.classList.add('active');
          } else {
            resultsBox.innerHTML = '<div class="no-results">No matches found</div>';
            resultsBox.classList.add('active');
          }
        } catch (err) {
          console.error("Search failed", err);
        }
      }, 150);
    });

    let currentResults = [];
    let selectedIndex = -1;

    function selectItem(item) {
      searchInput.value = item;
      resultsBox.classList.remove('active');
      selectedIndex = -1;
      fetch('/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: item })
      }).catch(() => {});
    }

    function renderResults(results, query) {
      resultsBox.innerHTML = '';
      currentResults = results;
      selectedIndex = -1;

      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${safeQuery})`, "gi");

      results.forEach(item => {
        const div = document.createElement('div');
        div.className = 'result-item';

        item.split(regex).forEach(part => {
          if (part.toLowerCase() === query.toLowerCase()) {
            const span = document.createElement('span');
            span.className = 'highlight';
            span.textContent = part;
            div.appendChild(span);
          } else {
            div.appendChild(document.createTextNode(part));
          }
        });
        div.addEventListener('click', () => selectItem(item));

        resultsBox.appendChild(div);
      });
    }

    searchInput.addEventListener('keydown', (e) => {
      const items = resultsBox.querySelectorAll('.result-item');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length === 0) return;
        selectedIndex = e.key === 'ArrowDown'
          ? Math.min(selectedIndex + 1, items.length - 1)
          : Math.max(selectedIndex - 1, 0);
        items.forEach((el, i) => el.classList.toggle('selected', i === selectedIndex));
      } else if (e.key === 'Enter' && selectedIndex >= 0 && currentResults[selectedIndex]) {
        selectItem(currentResults[selectedIndex]);
      } else if (e.key === 'Escape') {
        resultsBox.classList.remove('active');
        selectedIndex = -1;
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
        resultsBox.classList.remove('active');
      }
    });

    // Auto focus the input automatically mimicking a real search page
    window.onload = () => searchInput.focus();
  </script>
</body>
</html>
